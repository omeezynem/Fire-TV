name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tv-dash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-dash-apk
          path: tv-dash.apk

      # A fixed download link for the Fire TV Downloader app:
      # https://github.com/omeezynem/Fire-TV/releases/latest/download/tv-dash.apk
      - name: Publish as the latest release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-dash.apk \
            --title "TV Dash build ${GITHUB_SHA::7}" \
            --notes "Built from ${GITHUB_SHA}. Install on Fire TV with the Downloader app." \
            --latest
