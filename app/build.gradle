plugins {
    id "com.android.application"
}

android {
    namespace "com.tvdash.launcher"
    compileSdk 34

    defaultConfig {
        applicationId "com.tvdash.launcher"
        minSdk 22
        // Fire OS tops out at Android 11 (API 30).
        targetSdk 30
        versionCode 6
        versionName "1.5"
    }

    // One fixed key so new builds install over old ones without losing your favorites.
    signingConfigs {
        sideload {
            storeFile file("tv-dash.keystore")
            storePassword "tvdash"
            keyAlias "tvdash"
            keyPassword "tvdash"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
